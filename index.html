<body>

    <h1>Student Registration Form</h1>
    <form>
        <lable for=""> Full Name:</lable><br>
        <input type="text" placeholder="Enter your name"><br><br>


        <lable for="">Email:</lable><br>

        <lable for="">Password:</lable><br>
        <input type="password"><br><br>

         <div>
        <lable>Gender:</lable><br>

        <lable for="female"><input type="radio" name="Gender" id="female" required>FeMale</lable>
        </div><br>

        <div>
        <lable>Skills:</lable><br>
        <lable for="HTML"><input type="checkbox" name="Gender" id="HTML" >HTML</lable>
        <lable for="CSS"><input type="checkbox" name="Gender" id="CSS" >CSS</lable>
        <lable for="JavaScript"><input type="checkbox" name="Gender" id="JavaScript">JavaScript</lable><br><br>
        </div>
        
        <label for="">Date of Birth:</label><br>
        <input type="date"><br><br>


        <button type="Register">Register</button>
    </form>
